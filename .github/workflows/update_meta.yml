name: Update One Pace Subtitles

on:
  schedule:
    - cron: '30 */6 * * *' # Runs at minute 30 past every 6th hour 
  workflow_dispatch: # Adds the button to run it manually!

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to push code back to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pysubs2 requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Metadata and Subtitle Scripts
        run: |
          python -u subs.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Add all changes (JSONs, VTTs, and Hash memory)
          git add .

          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          # A failed report must never block the commit.
          python -u report.py > /tmp/commit_msg.txt || echo "[auto] subtitles refreshed" > /tmp/commit_msg.txt
          cat /tmp/commit_msg.txt

          git commit -F /tmp/commit_msg.txt
          git pull --rebase origin main
          git push
